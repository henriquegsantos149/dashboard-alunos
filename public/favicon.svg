      <stop offset="0%" stop-color="#6FB03A"/>
      <stop offset="100%" stop-color="#31A8A8"/>
    </linearGradient>
  </defs>

  <!-- Dark Background Squircle -->
  <rect width="64" height="64" rx="16" fill="#010404"/>
